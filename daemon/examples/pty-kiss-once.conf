# KiloTNC/daemon/examples/pty-kiss-once.conf

profile=pty-kiss-once
mode=NINO_MODE=6
kiss_pty=1
kiss_pty_once=1
pty_path_out=build/daemon/example.pty
pcm_out=build/daemon/example-pty.pcm
audio_backend=raw
audio_sample_rate=48000
audio_channels=1
audio_bits=16
radio_backend=none
max_tx_ms=30000
p=255
slottime_10ms=10
fullduplex=0
