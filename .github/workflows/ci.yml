# KiloTNC/.github/workflows/ci.yml

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean
        run: make clean

      - name: Test
        run: make test

      - name: Tools
        run: make tools

      - name: Tool Test
        run: make tool-test

      - name: Daemon
        run: make daemon

      - name: Daemon Test
        run: make daemon-test

      - name: KISS Compatibility Test
        run: make kiss-compat-test

      - name: Embedded Skeleton Test
        run: make embedded-test

      - name: Embedded Target Check
        run: make embedded-target-check

      - name: Sanitizers
        run: make sanitize
