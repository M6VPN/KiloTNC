# KiloTNC/daemon/examples/tcp-kiss-once.conf

profile=tcp-kiss-once
mode=NINO_MODE=6
kiss_tcp_listen=127.0.0.1:18019
kiss_tcp_once=1
allow_nonlocal_bind=0
pcm_out=build/daemon/example-tcp.pcm
audio_backend=raw
audio_sample_rate=48000
audio_channels=1
audio_bits=16
radio_backend=none
max_tx_ms=30000
p=255
slottime_10ms=10
fullduplex=0
